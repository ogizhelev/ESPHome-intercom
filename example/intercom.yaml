# =============================================================================
#  Intercom — ESP8266 apartment-intercom controller for ESPHome.
# =============================================================================

substitutions:
  name: intercom
  friendly_name: "Intercom"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: ogizhelev.intercom
    version: "0.0.1"

esp8266:
  board: nodemcuv2
  restore_from_flash: true

external_components:
  - source: github://ogizhelev/ESPHome-intercom@main
    components: [intercom]
    refresh: 0s        # always re-fetch @main (avoids a stale cached schema); raise once stable

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name}
    password: !secret wifi_password

captive_portal:
api:
ota:
  - platform: esphome
    password: !secret ota_password
logger:
web_server:
  port: 80
  version: 3

time:
  - platform: homeassistant
    id: homeassistant_time
  # Optional SNTP alternative (standalone, no Home Assistant). To use it: comment out the
  # homeassistant platform above, uncomment below, and set intercom.time_id: sntp_time.
  # - platform: sntp
  #   id: sntp_time
  #   servers: [0.pool.ntp.org, 1.pool.ntp.org, 2.pool.ntp.org]

# ---- The whole device: decode + open-door + scheduler + entities, all in the component ----
intercom:
  id: intercom1
  bus_pin: GPIO5            # call-decode input (basic pulse-count)
  ring_pin: GPIO14          # hardware ring line (optional)
  offhook_pin: GPIO13       # off-hook / open actuator (hook-flash)
  mute_pin: GPIO12          # mute output
  time_id: homeassistant_time   # must match the active time platform id above
  # Door-open polarity for the off-hook line (GPIO13). Default false = active-high
  # (GPIO13 HIGH = off-hook / engaged), which is hardware-confirmed to open the door.
  # Flip to true ONLY if your off-hook stage is wired active-low.
  # offhook_inverted: false
  open_delay: 2s
  mute_inverted: true        # this device's mute line is active-low (confirmed); set false if yours is active-high
  # ring_inverted: false
  # dump_raw: false          # true -> log raw bus pulse widths for calibration
  # frame_gap: 120ms         # bus-idle time that marks a ring as stopped
  # ring_min_hold: 120ms     # minimum time Doorbell (RING) stays on per ring burst
  clear_on_open: true      # opening the door clears RING/Decoding/Decoder immediately

  auto_open:                # defaults; live values are the UI entities (persisted)
    mode: schedule          # off | on | schedule  (user can override in the UI)
    on_ring: false          # true = open on ANY ring in the window (⚠ opens to anyone)
    open_apartment: 0       # open only when this decoded apartment id rings (0 = off; e.g. 13)
    from_hour: 8
    until_hour: 21
    days: [mon, tue, wed, thu, fri]

  mute:
    mode: schedule          # off | on | schedule  (user can override in the UI)
    from_hour: 22
    until_hour: 7
    days: [mon, tue, wed, thu, fri, sat, sun]

# ---- Diagnostics ----
# Basic HA diagnostics are on by default below. For deeper ESP8266 health (free heap,
# fragmentation, loop time, reset reason) uncomment the `debug:` component + the `debug`
# platform sensors.
# debug:
#   update_interval: 30s

sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi"
    update_interval: 60s
#   - platform: debug
#     free:
#       name: "Heap Free"           # ESP8266 ~80KB RAM: >20KB healthy, <10KB risky
#     fragmentation:
#       name: "Heap Fragmentation"
#     loop_time:
#       name: "Loop Time"           # small/steady = CPU not blocked

text_sensor:
  - platform: version
    name: "ESPHome Version"
  - platform: wifi_info
    ip_address:
      name: "IP Address"
#   - platform: debug
#     device:
#       name: "Device Info"
#     reset_reason:
#       name: "Reset Reason"        # Power On / clean vs Exception/WDT (crash)

button:
  - platform: restart
    name: "Restart device"
    icon: "mdi:restart"